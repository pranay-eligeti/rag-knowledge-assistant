name: Python CI

on:
  push:
  pull_request:

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests scripts
      - run: pytest
      - name: Offline capture export
        run: python -m src.capture --run-id ci-tfidf --top-k 1 --output scratch/capture.json
