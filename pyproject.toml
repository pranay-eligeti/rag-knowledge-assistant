[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "A grounded RAG knowledge assistant with retrieval evaluation, citations, and an optional OpenAI generation layer"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pranay Eligeti" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
openai = ["openai>=3,<4"]
semantic = ["sentence-transformers>=5,<6"]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "src/data"
